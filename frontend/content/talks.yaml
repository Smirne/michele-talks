    - { title: 'From Kubernetes to Kilowatts: GitOps and JVM Tuning', language: en }
    - { title: 'The Pilot Worked. Then We Had to Run It.', language: en }
    - {
        title: 'Flex your Energy: Building a Cloud-Native Platform for Renewable Energy Communities',
        language: en,
      }
