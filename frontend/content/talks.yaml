- slug: from-kubernetes-to-kilowatts
  title: 'From Kubernetes to Kilowatts: Shipping a Platform for Energy Communities'
  summary: >-
    How four companies took a Renewable Energy Community platform from an EU-funded pilot to
    production on Kubernetes, and what every optimisation actually cost.
  abstract:
    - >-
      Renewable Energy Communities let neighbours share the output of a local solar plant,
      and flexibility markets pay homes and businesses to shift consumption when the grid is
      under strain. SPARklE is the cloud-native platform behind both: built by four partner
      companies under EU research funding, and now running in production.
    - >-
      This talk covers the three engineering choices that made it work. Multitenancy with
      PostgreSQL Row-Level Security and a Keycloak realm per tenant, including the
      cross-tenant leak we caused ourselves and the rule that now prevents it. GitOps with
      FluxCD across partners who each own pieces of the system you don't control. And a
      container diet for Spring Boot services: jlink, AppCDS and the JDK 25 AOT cache took
      startup from 34 to 23 seconds on one CPU, and we measured what that bought and what it
      cost in image size and memory per replica.
    - Real production numbers, the mistakes included, and a live demo.
  durationMinutes: 35
  level: [beginner, intermediate]
  format: talk
  note: Length and technical depth adapt to the event, from an overview for energy-sector managers to a deep dive for developers.
  languages: [en, it]
  topics:
    [
      Kubernetes,
      GitOps / FluxCD,
      PostgreSQL multitenancy,
      Java / JVM performance,
      Energy transition,
      Energy communities,
      Flexibility markets,
      Cloud-native architecture,
    ]
  alsoGivenAs:
    - {
        title: 'Da Kubernetes al Kilowatt: GitOps e PostgreSQL RLS per le Comunità Energetiche Rinnovabili',
        language: it,
      }
    - { title: 'Da Kubernetes al kilowatt: architettura cloud-native per le CER', language: it }
    - {
        title: 'Scaling smart energy: building a cloud-native platform for renewable communities',
        language: it,
      }
